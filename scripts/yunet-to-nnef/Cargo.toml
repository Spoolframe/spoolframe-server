[package]
name = "yunet-to-nnef"
version = "0.0.0"
edition = "2024"
publish = false

# Not a member of the repo's workspace: this is the only crate with an ONNX
# parser, and the server must not be built with one.
[workspace]

[dependencies]
tract-nnef = { version = "=0.23.9", default-features = false }
tract-onnx = { version = "=0.23.9", default-features = false }
tract-onnx-opl = { version = "=0.23.9", default-features = false }
