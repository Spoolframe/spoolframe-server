name: Images

# Pushes the release images to ghcr.io/spoolframe/spoolframe-server, run by
# hand (Actions › Images › Run workflow) on the GitHub mirror. Forgejo
# ignores .github/; its CI is in .forgejo/workflows.
#
# Each architecture builds on a native runner: no emulation, so arm64 takes
# as long as amd64. scripts/push-images.sh --if-missing skips an
# architecture whose `<ver>-<arch>` is already on ghcr, so running it for a
# version that is out pushes nothing new. Then one job makes `<ver>` and
# `<ver>-slim` (and the exact-build twins) lists over both.
#
# GitHub gives the arm64 runners free to public repositories only: on a
# private one, the arm64 job waits for a runner that never comes.
#
# GITHUB_TOKEN pushes to ghcr because the package is linked to this
# repository and inherits its access (Package settings shows no "Manage
# Actions access" while it does).
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images
  cancel-in-progress: false

jobs:
  push:
    name: "push ${{ matrix.arch }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      # The server's closure (Rust, ffmpeg, our Mesa) does not fit in the
      # runner's free space. These are toolchains the build never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift
          df -h /

      - uses: actions/checkout@v7.0.1

      - uses: cachix/install-nix-action@v31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # spoolframe.cachix.org: what one run builds, the next one fetches.
      # CACHIX_AUTH_TOKEN is an organization secret.
      - uses: cachix/cachix-action@v17
        with:
          name: spoolframe
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: push-images
        run: scripts/push-images.sh --if-missing --no-list ${{ matrix.arch }}

  list:
    name: "list"
    needs: push
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: cachix/install-nix-action@v31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: push-images --list-only
        run: scripts/push-images.sh --list-only amd64 arm64
