name: Publish

# The SDK and the crates it needs (spoolframe-types, -protocol, -policy,
# -client-sdk, -client-ffi, -test-dir, -hls-bridge: every crate with
# `publish = ["crates-io", "coldsteel"]`) go to crates.io and to the
# Coldsteel registry (kellnr, https://cargo.coldsteel.casa). The apps take
# them from Coldsteel during development, past the kellnr crates.io
# proxy's cache, by patching each spoolframe crate to it
# (crates/spoolframe-client-sdk/README.md); everyone else from crates.io.
# Adapted from foundry's publish.yaml.
#
# Publishing is a consequence of landing on master, never of proposing to
# it: no pull_request trigger. It runs on every master push, not only on a
# version bump: scripts/publish-changed.sh compares each crate's version
# with a registry's index and publishes only what is missing, in
# dependency order, so a missed publish (a failed run, a registry down)
# heals on the next push. crates.io first, then Coldsteel, which resolves
# the crates' siblings from crates.io when it packages them; either one
# failing does not stop the other, and the job goes red after both. A run
# that publishes new crates to crates.io waits out its rate limit for them
# (about one every 10 minutes after a small burst).
on:
  push:
    branches:
      - master

env:
  CI: "true"
  TERM: dumb
  NO_COLOR: "1"
  # Reading crates.io's index is anonymous. The write token is scoped to
  # the publish step alone, below.

jobs:
  publish:
    name: "publish"
    runs-on: beefy
    steps:
      - uses: actions/checkout@v4
      # GitHub's API limit for Nix's github: inputs: a read-only GH_PAT
      # raises it from 60 to 5,000 requests an hour. Forgejo withholds
      # secrets from pull_request runs, and an empty token is worse than
      # none, so NIX_CONFIG is set only when the run has one.
      - name: GitHub token for Nix, when this run has one
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_PAT" ]; then
            echo "NIX_CONFIG=access-tokens = github.com=$GH_PAT" >> "$GITHUB_ENV"
          fi

      # Inside the ci profile's shell, as CI's tasks run: `cargo publish`
      # verify-builds each crate and needs the pinned toolchain.
      #
      # crates.io first: the crates depend on each other as crates.io
      # crates, and packaging one for Coldsteel resolves its siblings from
      # crates.io's own index (the script gives `cargo publish` a cargo home
      # with no kellnr proxy in it), so a new version must be there first. Its failure does not skip Coldsteel's step, which publishes
      # whatever crates.io took.
      #
      # CARGO_REGISTRY_TOKEN, a secret of this repository: a crates.io API
      # token (crates.io › Account Settings › API Tokens › New Token) with
      # the publish-new and publish-update scopes, limited to the crate
      # pattern `spoolframe-*`, so it can publish nothing else. One with an
      # expiry date needs replacing when it runs out: publishing then fails
      # to authenticate.
      - name: publish-changed (crates-io)
        id: crates-io
        continue-on-error: true
        shell: devenv --no-tui shell --profile ci -- bash -eo pipefail {0}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: scripts/publish-changed.sh --publish --registry crates-io .

      # The same sources, not verify-built again: crates.io's step just did.
      # The index is .cargo/config.toml's [registries.coldsteel].
      #
      # CARGO_REGISTRIES_COLDSTEEL_TOKEN: an API token from the kellnr web
      # UI at https://cargo.coldsteel.casa, a secret of this repository or
      # its org.
      - name: publish-changed (coldsteel)
        id: coldsteel
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: devenv --no-tui shell --profile ci -- bash -eo pipefail {0}
        env:
          CARGO_REGISTRIES_COLDSTEEL_TOKEN: ${{ secrets.CARGO_REGISTRIES_COLDSTEEL_TOKEN }}
        run: scripts/publish-changed.sh --publish --registry coldsteel .

      # Either publish failed: say which, and fail the job, so the next
      # master push (which publishes what is missing) is not the only
      # notice.
      - name: report a failed publish
        if: ${{ !cancelled() && (steps.crates-io.outcome == 'failure' || steps.coldsteel.outcome == 'failure') }}
        env:
          CRATES_IO: ${{ steps.crates-io.outcome }}
          COLDSTEEL: ${{ steps.coldsteel.outcome }}
        run: |
          echo "::error::publishing failed: crates.io $CRATES_IO, Coldsteel $COLDSTEEL (see the publish-changed steps)."
          exit 1

      # kache (the coldsteel profile, devenv.nix) queues uploads in a daemon,
      # and the job's container may go before it drains them.
      - name: kache flush
        if: always()
        shell: devenv --no-tui shell --profile ci -- bash -eo pipefail {0}
        # As molds' ci:kache-flush: record this job's stats in the shared
        # store's sessions.jsonl (the runner's kache_ci_* metrics), then
        # drain queued uploads and stop the daemon.
        run: |
          kache stats --since 30d --record >/dev/null || true
          kache daemon stop || true
