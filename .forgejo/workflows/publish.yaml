name: Publish

# The SDK and the crates it needs (spoolframe-types, -protocol, -policy,
# -client-sdk, -test-dir: every crate with `publish = ["coldsteel"]`) go to
# the Coldsteel cargo registry, where the Linux and Apple clients take them
# from. Adapted from foundry's publish.yaml.
#
# Publishing is a consequence of landing on master, never of proposing to
# it: no pull_request trigger. It runs on every master push, not only on a
# version bump: scripts/publish-changed.sh compares each crate's version
# with the registry index and publishes only what is missing, in dependency
# order, so a missed publish (a failed run, the registry down) heals on the
# next push.
on:
  push:
    branches:
      - master

env:
  CI: "true"
  TERM: dumb
  NO_COLOR: "1"
  # The registry itself is named in .cargo/config.toml; reads are anonymous.
  # The write token is scoped to the publish step alone, below.

jobs:
  publish:
    name: "publish"
    runs-on: beefy
    steps:
      - uses: actions/checkout@v4
      # GitHub's API limit for Nix's github: inputs: a read-only GH_PAT
      # raises it from 60 to 5,000 requests an hour. Forgejo withholds
      # secrets from pull_request runs, and an empty token is worse than
      # none, so NIX_CONFIG is set only when the run has one.
      - name: GitHub token for Nix, when this run has one
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_PAT" ]; then
            echo "NIX_CONFIG=access-tokens = github.com=$GH_PAT" >> "$GITHUB_ENV"
          fi
      # crates.io through the kellnr proxy on cargo.coldsteel.casa, in our
      # CI only. Cargo does not read [source.*] from environment variables
      # (tested), so this writes it into cargo's home config: the repo
      # stays clean (cargo publish checks that) and a public checkout keeps
      # building against crates.io. The checkout's parent is not writable
      # in the job's container. A home config that already replaces
      # crates.io (a host runner's own) is left alone.
      - name: Cargo through our crates.io mirror
        run: |
          home="${CARGO_HOME:-$HOME/.cargo}"
          mkdir -p "$home"
          if grep -qs '^\[source.crates-io\]' "$home/config.toml"; then
            echo "$home/config.toml already replaces crates.io; left as it is"
            exit 0
          fi
          cat >> "$home/config.toml" <<'TOML'
          [source.crates-io]
          replace-with = "coldsteel-mirror"

          [source.coldsteel-mirror]
          registry = "sparse+https://cargo.coldsteel.casa/api/v1/cratesio/"
          TOML

      # Inside the ci profile's shell, as CI's tasks run: `cargo publish`
      # verify-builds each crate and needs the pinned toolchain.
      #
      # CARGO_REGISTRIES_COLDSTEEL_TOKEN: an API token from the kellnr web
      # UI at https://cargo.coldsteel.casa. Org-level secret in foundry's
      # org; this repo needs it at its own org or repo level.
      - name: publish-changed
        shell: devenv --no-tui shell --profile ci -- bash -eo pipefail {0}
        env:
          CARGO_REGISTRIES_COLDSTEEL_TOKEN: ${{ secrets.CARGO_REGISTRIES_COLDSTEEL_TOKEN }}
        run: scripts/publish-changed.sh --publish .
