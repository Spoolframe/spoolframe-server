# The server graph permits its existing MPL dependencies and named AGPL crates.
[graph]
all-features = true
exclude-dev = true

[licenses]
confidence-threshold = 0.95
allow = [
  "MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC",
  "Unicode-3.0", "Zlib", "CC0-1.0", "Unlicense", "BSL-1.0", "CDLA-Permissive-2.0", "MPL-2.0",
]

# Only our server-side crates may introduce AGPL into the server graph.
# The public crates are checked separately with deny-sdk.toml (no exceptions).
exceptions = [
  { crate = "spoolframe-policy", allow = ["GPL-3.0-or-later"] },
  { crate = "spoolframe-server", allow = ["AGPL-3.0-or-later"] },
  { crate = "spoolframe-web", allow = ["AGPL-3.0-or-later"] },
  { crate = "spoolframe-media", allow = ["AGPL-3.0-or-later"] },
  { crate = "spoolframe-catalog", allow = ["AGPL-3.0-or-later"] },
  { crate = "spoolframe-plex", allow = ["AGPL-3.0-or-later"] },
  { crate = "spoolframe-admin-api", allow = ["AGPL-3.0-or-later"] },
  { crate = "spoolframe-federation", allow = ["AGPL-3.0-or-later"] },
  # Subtitle sync's aligner (PX-03), linked into spoolframe-media only.
  # GPL-3.0 only: AGPL-3.0 §13 and GPL-3.0 §13 let the two be combined.
  { crate = "alass-core", allow = ["GPL-3.0-only"] },
]
# The fuzz targets (fuzz/) are checked with fuzz/deny.toml: an exception
# for a crate a graph lacks is a warning, so each graph names only its own.

# alass-core says "GPL-3.0", SPDX's deprecated name for GPL-3.0-only, and
# ships no license file.
[[licenses.clarify]]
crate = "alass-core"
expression = "GPL-3.0-only"
license-files = []

# uclicious-libucl-sys 0.9.2 names only its license file, which is MIT.
# It links the system's libucl and vendors none of its C. Pinned to the
# version read, so a new one is looked at again.
[[licenses.clarify]]
crate = "uclicious-libucl-sys@0.9.2"
expression = "MIT"
license-files = []

# Accepted advisories (PX-09 C-15, written down in PX-11 finding 39), so
# `cargo deny --locked check advisories` passes and a new one stands out.
[advisories]
ignore = [
  # basic-toml: unmaintained, not vulnerable. Read at build time by
  # askama's derive macro, in uniffi_bindgen: only spoolframe-client-ffi's
  # `bindgen` feature (its uniffi-bindgen bin) builds it, never the
  # library an app links or the server.
  { id = "RUSTSEC-2026-0374", reason = "basic-toml is read only by askama's derive macro, at build time, in the optional bindings generator" },
  # rsa: the Marvin timing attack recovers a private key from many timed
  # decryptions or signatures. Here rsa comes in only through openidconnect
  # to verify a provider's RS256 ID token signatures with its public keys;
  # the server holds no RSA private key and does no RSA private-key
  # operation. No fixed rsa release exists.
  { id = "RUSTSEC-2023-0071", reason = "rsa is used only to verify OIDC ID token signatures (public keys); no private-key operations" },
  # paste: unmaintained, not vulnerable. A proc-macro run at build time
  # (through iroh's netlink-packet-core); none of it is in the binary.
  { id = "RUSTSEC-2024-0436", reason = "paste is an unmaintained build-time proc-macro; no code of it runs in the server" },
  # crypto-bigint 0.5: constant-time operations that may branch on secret
  # values. It now comes in only through openidconnect 4.0.1, whose p256
  # and p384 0.13 (elliptic-curve) verify ES256 and ES384 ID tokens with
  # public keys. Our own p256 is 0.14, so the SDK graph is clear. The fix
  # is crypto-bigint 0.7.6; drop this when openidconnect moves to 0.14.
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 comes through p256 0.13 in openidconnect, used only to verify ECDSA signatures (public keys); no secret operations" },
  # block-buffer below 0.12.1: a hasher reused after a panic in the middle
  # of an update may read stale buffer state. Only in the server's graph,
  # through digest 0.10 in openidconnect 4.0.1, oauth2 5.0.0, sqlx 0.9.0
  # and soketto 0.8.1, each at its latest release; every block-buffer
  # below 0.12.1 is affected. The server never reuses a hasher after a
  # panic. Our own sha2 is 0.11, so the SDK graph is clear.
  { id = "GHSA-qwgh-2vcv-g2f7", reason = "block-buffer < 0.12.1 comes through digest 0.10 in openidconnect, oauth2, sqlx and soketto, all at their latest; no hasher is reused after a panic" },
  # zstd 0.13 and zstd-safe 7: stale data across a reused stream context,
  # Seekable::decompress past the end, and uninitialized memory after a
  # failed legacy frame. They come only through foyer-storage 0.22.6
  # (foyer's latest), which uses zstd for its disk tier's optional value
  # compression. The server's artwork, previews and Plex caches never
  # turn compression on (foyer's default is none), so no zstd stream is
  # made or read; it uses no Seekable and no legacy frame. The fixes are
  # zstd 0.14.3 and zstd-safe 8.2.0, which foyer 0.22 cannot take: drop
  # these when foyer moves to them.
  { id = "RUSTSEC-2026-0391", reason = "zstd 0.13 comes only through foyer-storage, whose value compression the server never turns on" },
  { id = "RUSTSEC-2026-0398", reason = "zstd-safe 7 comes only through foyer-storage, which uses no Seekable; its compression is never on here" },
  { id = "RUSTSEC-2026-0403", reason = "zstd-safe 7 comes only through foyer-storage, whose value compression the server never turns on" },
  # zstd-safe 7's unsound safe API (use-after-free, double free, reads
  # out of bounds in its contexts, buffers, dictionaries, Seekable and
  # training): cargo audit reports them, as warnings. Not reachable here
  # for the same reason: foyer's compression is never on.
  { id = "RUSTSEC-2026-0395", reason = "unsound zstd-safe 7 API, through foyer-storage only, whose compression the server never turns on" },
  { id = "RUSTSEC-2026-0396", reason = "unsound zstd-safe 7 API, through foyer-storage only, whose compression the server never turns on" },
  { id = "RUSTSEC-2026-0397", reason = "unsound zstd-safe 7 API, through foyer-storage only, whose compression the server never turns on" },
  { id = "RUSTSEC-2026-0399", reason = "unsound zstd-safe 7 API, through foyer-storage only, whose compression the server never turns on" },
  { id = "RUSTSEC-2026-0400", reason = "unsound zstd-safe 7 API, through foyer-storage only, whose compression the server never turns on" },
  { id = "RUSTSEC-2026-0401", reason = "unsound zstd-safe 7 API, through foyer-storage only, whose compression the server never turns on" },
  { id = "RUSTSEC-2026-0402", reason = "unsound zstd-safe 7 API, through foyer-storage only, whose compression the server never turns on" },
  { id = "RUSTSEC-2026-0404", reason = "unsound zstd-safe 7 API, through foyer-storage only, whose compression the server never turns on" },
  { id = "RUSTSEC-2026-0405", reason = "unsound zstd-safe 7 API, through foyer-storage only, whose compression the server never turns on" },
  { id = "RUSTSEC-2026-0406", reason = "unsound zstd-safe 7 API, through foyer-storage only, whose compression the server never turns on" },
]

# Several versions of one crate come from upstream (iroh, the HTTP and
# TLS stacks pinning different majors), not from a choice made here: a
# warning for each would bury a real finding. `cargo tree -d` lists them.
[bans]
multiple-versions = "allow"

# Every crate from crates.io, but for noq-proto, pinned to a commit of
# noq's main until a release carries the stream-assembler fix (the root
# Cargo.toml's [patch.crates-io], PX-62). Anything else from git, or from
# another registry, is a mistake.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/n0-computer/noq"]
