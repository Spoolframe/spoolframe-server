[package]
name = "spoolframe-media"
description = "Spoolframe's own view of a media file: ffprobe into a MediaDescriptor."
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "AGPL-3.0-or-later"

[dependencies]
async-trait = { workspace = true }
easy-ffprobe = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
spoolframe-types = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }

[dev-dependencies]
spoolframe-test-dir = { workspace = true }
# Its own PGS fixtures, for the OCR tests.
spoolframe-media = { workspace = true, features = ["fixtures"] }

[features]
# `pgs::fixture`: writes PGS streams for tests elsewhere.
fixtures = []
