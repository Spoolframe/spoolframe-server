[package]
name = "spoolframe-media"
description = "Spoolframe's own view of a media file: ffprobe into a MediaDescriptor."
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
async-trait = { workspace = true }
easy-ffprobe = { workspace = true }
# What the tools it runs may reach (sandbox.rs): Landlock's file and
# network rules, made before the fork and applied after it.
landlock = { workspace = true }
# Limits and the seccomp filter for the tools it runs, between fork and exec.
libc = { workspace = true }
# The tools' seccomp filter, compiled to BPF.
seccompiler = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
spoolframe-types = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt"] }
tracing = { workspace = true }

[dev-dependencies]
spoolframe-test-dir = { workspace = true }
# Its own PGS fixtures, for the OCR tests.
spoolframe-media = { workspace = true, features = ["fixtures"] }

[features]
# `pgs::fixture`: writes PGS streams for tests elsewhere.
fixtures = []
