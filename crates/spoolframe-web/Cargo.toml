[package]
name = "spoolframe-web"
description = "The Spoolframe web UI (P3): sign-in, the admin pages and My profile."
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "AGPL-3.0-or-later"
publish = false

# The app is wasm only (`dx bundle --platform web`). On the host the crate
# is its plain logic and that logic's tests, so a workspace build or test
# never compiles Dioxus for nothing.
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# Its types build only with a side chosen.
spoolframe-admin-api = { workspace = true, features = ["client"] }
# The invite's QR code (P6-01), drawn as an SVG path; the encoder only,
# as the Linux app takes it.
qrcode = { version = "0.14", default-features = false }

# `required::option`, for the `/auth` answers' required `Option` fields;
# its calendar dates, for the pages' dates (host-tested too).
spoolframe-types = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus = { workspace = true }
dioxus-logger = { workspace = true }
gloo-net = { workspace = true }
js-sys = "0.3"
jsonrpsee = { workspace = true, features = ["wasm-client"] }
tracing = { workspace = true }
wasm-bindgen = { workspace = true }
# Awaits the passkey prompt's promise (P3-05).
wasm-bindgen-futures = "0.4"
web-sys = { workspace = true, features = [
    "Navigator",
    "Clipboard",
    # The catalog's columns, kept per browser (P3-16).
    "Storage",
    # Taking the SSO callback's outcome out of the address (P3-04).
    "History",
    # The browser's passkey prompts.
    "CredentialsContainer",
    "CredentialCreationOptions",
    "CredentialRequestOptions",
    # Server › Logs' Download: the lines shown, as a file (P3-14).
    "Blob",
    "BlobPropertyBag",
    "Url",
    "Document",
    "HtmlAnchorElement",
    # The output codecs' drag (PGPU-06): the grip keeps the pointer.
    "PointerEvent",
    "Element",
] }

# dx looks for it even for a web-only bundle.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
dioxus-fullstack = "=0.7.10"
