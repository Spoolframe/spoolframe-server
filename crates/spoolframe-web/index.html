<!DOCTYPE html>
<html>
    <head>
        <title>{app_title}</title>
        <meta content="text/html;charset=utf-8" http-equiv="Content-Type">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta charset="UTF-8">
        <!-- dx's own template (dioxus-cli 0.7.10), with these two added: the
             pages are already dark (Catppuccin Mocha), so a browser's
             night mode must leave them be. Firefox for iOS's Night Mode is
             Dark Reader, which decides as the page loads: here, not added
             later by the app. -->
        <meta name="color-scheme" content="light dark">
        <meta name="darkreader-lock">
    </head>
    <body>
        <div id="main"></div>
    </body>
</html>
