[package]
name = "spoolframe-plex"
description = "PlexCatalog: Plex Media Server as Spoolframe's library source."
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "AGPL-3.0-or-later"

[dependencies]
async-trait = { workspace = true }
# Searching every section and hub at once (P3-09).
futures-util = { workspace = true, features = ["alloc"] }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
spoolframe-catalog = { workspace = true }
spoolframe-types = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
thiserror = { workspace = true }
# GDM, Plex's LAN discovery (P3-10), over UDP.
tokio = { workspace = true, features = ["net"] }

[dev-dependencies]
spoolframe-test-dir = { workspace = true }
wiremock = { workspace = true }
