[package]
name = "spoolframe-probe"
description = "Checks that a Spoolframe server keeps its documented limits for devices with no session, and for a signed-in consumer, over live QUIC and its web listener."
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
# Permissive: it links only the protocol, the types and iroh, as a client
# does. Kept out of the server binary and the server's package.
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "spoolframe-probe"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
iroh = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
spoolframe-protocol = { workspace = true }
# The federation run (`federation`, P8) plays as an app does, so it uses
# the SDK, permissive as this crate is.
spoolframe-client-sdk = { workspace = true }
spoolframe-types = { workspace = true }
parking_lot = { workspace = true }
reqwest = { workspace = true }
# Installs aws-lc-rs as the process's TLS provider at start.
rustls = { workspace = true }
tokio = { workspace = true }
