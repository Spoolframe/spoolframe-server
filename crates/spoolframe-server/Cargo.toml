[package]
name = "spoolframe-server"
description = "The Spoolframe media server."
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "AGPL-3.0-or-later"

[[bin]]
name = "spoolframe-server"
path = "src/main.rs"

[features]
# Carry the web UI (P3-01): the `dx bundle` output at SPOOLFRAME_WEB_DIST,
# as `nix build` makes it.
embed-web = ["dep:rust-embed"]
# The stand-ins in `test_support` (a fake catalog, a stand-in ffprobe), for
# the integration tests: only the crate's own dev-dependency below turns it
# on.
test-support = []

[dependencies]
snmalloc-rs.workspace = true
rust-embed = { workspace = true, optional = true, features = ["mime-guess"] }
async-trait = { workspace = true }
axum = { workspace = true }
# A debug build's proxy to `dx serve` (web/dev_server.rs); unused in release.
hyper = { workspace = true }
hyper-util = { workspace = true }
reqwest = { workspace = true }
# Installs aws-lc-rs as the process's TLS provider at start.
rustls = { workspace = true }
anyhow = { workspace = true }
argon2 = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }
password-hash = { workspace = true }
clap = { workspace = true }
image = { workspace = true }
jsonrpsee = { workspace = true, features = ["server", "ws-client"] }
rpassword = { workspace = true }
spoolframe-admin-api = { workspace = true, features = ["server", "client"] }
tower = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
spoolframe-catalog = { workspace = true }
spoolframe-media = { workspace = true }
spoolframe-plex = { workspace = true }
spoolframe-protocol = { workspace = true }
iroh = { workspace = true }
iroh-mdns-address-lookup = { workspace = true }
netwatch = { workspace = true }
portmapper = { workspace = true }
spoolframe-types = { workspace = true }
spoolframe-policy = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
tracing-opentelemetry = { workspace = true }
opentelemetry-appender-tracing = { workspace = true }
# webpki roots for an https OTLP endpoint, which opentelemetry-otlp's own
# feature would bring with ring (the workspace Cargo.toml).
tonic = { workspace = true, features = ["tls-webpki-roots"] }
parking_lot = { workspace = true }
tokio = { workspace = true }
uclicious = { workspace = true }
webauthn-rs = { workspace = true }
webauthn-rs-proto = { workspace = true }
openidconnect = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# Itself, with the stand-ins the integration tests share with the unit tests.
spoolframe-server = { path = ".", features = ["test-support"] }
# The stand-in OTLP collector (P3-14).
opentelemetry-proto = { workspace = true }
prost = { workspace = true }
tonic = { workspace = true, features = ["transport", "router", "codegen"] }
# A stand-in PMS for the admin API's Plex status.
wiremock = { workspace = true }
spoolframe-test-dir = { workspace = true }
cargo_metadata = { workspace = true }
m3u8-rs = { workspace = true }
futures-util = { workspace = true }
spoolframe-client-sdk = { workspace = true }
# Its live checks of the stranger limits, run against a test server (PX-11).
spoolframe-probe = { workspace = true }
webauthn-authenticator-rs = { workspace = true }
# The stand-in OpenID Connect provider's token times (P3-04).
chrono = { workspace = true }
# PGS tracks for the OCR tests.
spoolframe-media = { workspace = true, features = ["fixtures"] }
# Paused time, for the Plex sync's schedule.
tokio = { workspace = true, features = ["test-util"] }
