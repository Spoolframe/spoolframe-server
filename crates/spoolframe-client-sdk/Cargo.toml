[package]
name = "spoolframe-client-sdk"
description = "SDK for Spoolframe client apps: find and connect to servers over Iroh, sign in, browse and play media."
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "MIT OR Apache-2.0"
publish = ["crates-io", "coldsteel"]

[features]
default = []
media-readers = []
# UniFFI's traits on the public types an app sees, for
# spoolframe-client-ffi. Off by default: the server never builds UniFFI.
uniffi = ["dep:uniffi", "spoolframe-protocol/uniffi", "spoolframe-types/uniffi"]
# Lets a test look a server up over plain HTTP
# (`Client::allow_http_lookups`), as a test server has no certificate.
# Never on in an app: the key in the document is what the device dials.
test-http-lookup = []

[dependencies]
# The PIN checked offline, hashed as the server hashes it.
argon2 = { workspace = true }
async-trait = { workspace = true }
# WebAuthn's JSON forms: base64url byte strings.
base64 = { workspace = true }
# The portable identity's root and its recovery phrase.
bip39 = { workspace = true }
blake3 = { workspace = true }
ed25519-dalek = { workspace = true }
getrandom = { workspace = true }
zeroize = { workspace = true }
futures-util = { workspace = true }
iroh = { workspace = true }
iroh-mdns-address-lookup = { workspace = true }
# statvfs: the free space downloads have.
libc = { workspace = true }
# soft-key: the software security key the SDK offers.
spoolframe-protocol = { workspace = true, features = ["soft-key"] }
# The clientDataHash a security key root signs.
sha2 = { workspace = true }
spoolframe-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
# Fetches a server's document at the address a person typed
# (`Client::look_up_server`). Already in the build through iroh, with the
# same features; the TLS config is the endpoint's own (webpki roots,
# aws-lc-rs), so no other provider or verifier is set up.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
tokio = { workspace = true }
tracing = { workspace = true }
# The offline database: playlists, hearts and the search index
# (downloads/local_db.rs); bundled, so every platform has FTS5.
#
# A range, not one version. libsqlite3-sys `links = "sqlite3"`, so a tree
# has one copy. The server's sqlx (sqlx-sqlite 0.9) caps it below 0.38, so
# this workspace resolves rusqlite 0.39 / libsqlite3-sys 0.37 and ignores
# RUSTSEC-2026-0459 for it (deny.toml, audit.toml). An app, which has no
# sqlx, resolves the newest in range: rusqlite 0.43 / libsqlite3-sys 0.40,
# which has the fix. The SDK uses only the API both ends share, and CI
# tests it against the newest (scripts/sdk-newest-sqlite.sh). Raise the
# floor once sqlx lifts its cap.
rusqlite = { version = ">=0.39, <0.44", features = ["bundled"] }
# Folds accents for search with no server (`Client::search_offline`).
unicode-normalization = "0.1.25"
uniffi = { workspace = true, optional = true }
# The pkarr relays servers are looked up at.
url = { workspace = true }
uuid = { workspace = true }

# This device's addresses (getifaddrs) for Session::at_home_here and
# default_quality_here. Android passes its own: ConnectivityManager knows
# its networks, and getifaddrs needs no permission it lacks there.
[target.'cfg(any(target_vendor = "apple", target_os = "linux"))'.dependencies]
netdev = { workspace = true }

[dev-dependencies]
socket2 = { workspace = true }
spoolframe-test-dir = { workspace = true }
anyhow = { workspace = true }
# `net`: a UDP forwarder stands in for a slow path to a server.
tokio = { workspace = true, features = ["net"] }
tracing-subscriber = { workspace = true }
