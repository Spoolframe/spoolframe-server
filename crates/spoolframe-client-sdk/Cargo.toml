[package]
name = "spoolframe-client-sdk"
description = "Client side of Spoolframe: Iroh transport, saved servers, sessions."
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "MIT OR Apache-2.0"
publish = ["coldsteel"]

[features]
default = []
media-readers = []

[dependencies]
async-trait = { workspace = true }
# The portable identity's root and its recovery phrase (P7-01).
bip39 = { workspace = true }
blake3 = { workspace = true }
ed25519-dalek = { workspace = true }
getrandom = { workspace = true }
zeroize = { workspace = true }
futures-util = { workspace = true }
iroh = { workspace = true }
iroh-mdns-address-lookup = { workspace = true }
# soft-key: the software security key the SDK offers (P7-08).
spoolframe-protocol = { workspace = true, features = ["soft-key"] }
# The clientDataHash a security key root signs (P7-08).
sha2 = { workspace = true }
spoolframe-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# The pkarr relays servers are looked up at (P6-05).
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
socket2 = { workspace = true }
spoolframe-test-dir = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
