[package]
name = "spoolframe-protocol"
description = "The spoolframe/client/1 wire protocol."
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "MIT OR Apache-2.0"
publish = ["crates-io"]

[features]
# A software security key that writes real CTAP2 assertions: for
# tests, and for a device that has no key at hand to test with.
soft-key = []

[dependencies]
# The invite holder's token for the server's relay.
base64 = { workspace = true }
blake3 = { workspace = true }
ciborium = { workspace = true }
ciborium-ll = { workspace = true }
# Checks what a portable user's root signed; never signs.
ed25519-dalek = { workspace = true }
# Checks what a security key root signed; never signs.
p256 = { workspace = true }
serde = { workspace = true }
serde_bytes = { workspace = true }
sha2 = { workspace = true }
spoolframe-types = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
