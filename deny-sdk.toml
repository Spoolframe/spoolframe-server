# The public SDK graph must stay usable without copyleft obligations.
[graph]
all-features = true
exclude-dev = true

[licenses]
confidence-threshold = 0.95
# The licenses any public crate may bring in. Each is checked alone, and
# a small graph uses few of them, which is no reason to warn.
unused-allowed-license = "allow"
# Each public crate is checked alone, and only some link UniFFI.
unused-license-exception = "allow"
allow = [
  "MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC",
  "Unicode-3.0", "Zlib", "CC0-1.0", "Unlicense", "BSL-1.0", "CDLA-Permissive-2.0",
]
# UniFFI, behind the `uniffi` feature of types, protocol and the client
# SDK and in spoolframe-client-ffi: MPL-2.0, whose copyleft is per file,
# so an app links it under its own license so long as UniFFI's own files
# stay MPL. Named crate by crate: MPL from anywhere else still fails.
exceptions = [
  { crate = "uniffi", allow = ["MPL-2.0"] },
  { crate = "uniffi_bindgen", allow = ["MPL-2.0"] },
  { crate = "uniffi_core", allow = ["MPL-2.0"] },
  { crate = "uniffi_internal_macros", allow = ["MPL-2.0"] },
  { crate = "uniffi_macros", allow = ["MPL-2.0"] },
  { crate = "uniffi_meta", allow = ["MPL-2.0"] },
  { crate = "uniffi_pipeline", allow = ["MPL-2.0"] },
  { crate = "uniffi_udl", allow = ["MPL-2.0"] },
]

# Accepted advisories (PX-09 C-15, written down in PX-11 finding 39), so
# `cargo deny --locked check advisories` passes and a new one stands out.
# The same acceptances as deny.toml's.
[advisories]
# The same list as deny.toml's, and rsa is not in the SDK's graph: an
# acceptance waiting for a crate that is not there is no reason to warn.
unused-ignored-advisory = "allow"
ignore = [
  # chrono: unmaintained, not vulnerable, with no fixed version. In the
  # SDK's graph on Windows only: iroh's netwatch reads interfaces through
  # wmi, which requires it. deny.toml has the server's reasons.
  { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained, not vulnerable; in the SDK only on Windows, through iroh's netwatch and wmi, with no way to turn it off" },
  # basic-toml: unmaintained, not vulnerable. Read at build time by
  # askama's derive macro, in uniffi_bindgen: only spoolframe-client-ffi's
  # `bindgen` feature (its uniffi-bindgen bin) builds it, never the
  # library an app links or the server.
  { id = "RUSTSEC-2026-0374", reason = "basic-toml is read only by askama's derive macro, at build time, in the optional bindings generator" },
  # rsa: not in the SDK's graph today. Accepted only for verification:
  # should it come in, check that nothing does an RSA private-key
  # operation with it, which the Marvin timing attack targets.
  { id = "RUSTSEC-2023-0071", reason = "rsa accepted for signature verification only (public keys); no private-key operations" },
  # paste: unmaintained, not vulnerable. A build-time proc-macro, in the
  # server's graph only (foyer-memory) since iroh 1.5; kept so the list
  # stays deny.toml's.
  { id = "RUSTSEC-2024-0436", reason = "paste is an unmaintained build-time proc-macro; no code of it runs in the SDK" },
]

# Several versions of one crate come from upstream (iroh, the HTTP and
# TLS stacks pinning different majors), not from a choice made here: a
# warning for each would bury a real finding. `cargo tree -d` lists them.
[bans]
multiple-versions = "allow"

# Every crate from crates.io. Anything from git, or from another
# registry, is a mistake.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
