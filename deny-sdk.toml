# The public SDK graph must stay usable without copyleft obligations.
[graph]
all-features = true
exclude-dev = true

[licenses]
confidence-threshold = 0.95
# The licenses any public crate may bring in. Each is checked alone, and
# a small graph uses few of them, which is no reason to warn.
unused-allowed-license = "allow"
allow = [
  "MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC",
  "Unicode-3.0", "Zlib", "CC0-1.0", "Unlicense", "BSL-1.0", "CDLA-Permissive-2.0",
]

# Accepted advisories (PX-09 C-15, written down in PX-11 finding 39), so
# `cargo deny --locked check advisories` passes and a new one stands out.
# The same acceptances as deny.toml's.
[advisories]
# The same list as deny.toml's, and rsa is not in the SDK's graph: an
# acceptance waiting for a crate that is not there is no reason to warn.
unused-ignored-advisory = "allow"
ignore = [
  # rsa: not in the SDK's graph today. Accepted only for verification:
  # should it come in, check that nothing does an RSA private-key
  # operation with it, which the Marvin timing attack targets.
  { id = "RUSTSEC-2023-0071", reason = "rsa accepted for signature verification only (public keys); no private-key operations" },
  # paste: unmaintained, not vulnerable. A proc-macro run at build time
  # (through iroh's netlink-packet-core); none of it is in the binary.
  { id = "RUSTSEC-2024-0436", reason = "paste is an unmaintained build-time proc-macro; no code of it runs in the SDK" },
]

# Several versions of one crate come from upstream (iroh, the HTTP and
# TLS stacks pinning different majors), not from a choice made here: a
# warning for each would bury a real finding. `cargo tree -d` lists them.
[bans]
multiple-versions = "allow"

# Every crate from crates.io, but for noq-proto, pinned to a commit of
# noq's main until a release carries the stream-assembler fix (the root
# Cargo.toml's [patch.crates-io], PX-62). Anything else from git, or from
# another registry, is a mistake.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/n0-computer/noq"]
