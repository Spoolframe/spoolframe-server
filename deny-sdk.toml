# The public SDK graph must stay usable without copyleft obligations.
[graph]
all-features = true
exclude-dev = true

[licenses]
confidence-threshold = 0.95
allow = [
  "MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC",
  "Unicode-3.0", "Zlib", "CC0-1.0", "Unlicense", "BSL-1.0", "CDLA-Permissive-2.0",
]

# Accepted advisories (PX-09 C-15, written down in PX-11 finding 39), so
# `cargo deny --locked check advisories` passes and a new one stands out.
# The same acceptances as deny.toml's.
[advisories]
ignore = [
  # rsa: not in the SDK's graph today. Accepted only for verification:
  # should it come in, check that nothing does an RSA private-key
  # operation with it, which the Marvin timing attack targets.
  { id = "RUSTSEC-2023-0071", reason = "rsa accepted for signature verification only (public keys); no private-key operations" },
  # paste: unmaintained, not vulnerable. A proc-macro run at build time
  # (through iroh's netlink-packet-core); none of it is in the binary.
  { id = "RUSTSEC-2024-0436", reason = "paste is an unmaintained build-time proc-macro; no code of it runs in the SDK" },
]
