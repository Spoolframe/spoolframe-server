[workspace]
resolver = "2"
members = ["crates/*"]
# Third-party crates carried with local changes; see each one's VENDORED.md.
# Not members: they keep their own license and are not linted as ours.
exclude = ["vendor"]

# No workspace-wide license: the protocol, types and client SDK are
# permissive so that any client may link them, the server crates are AGPL
# (ARCHITECTURE §56). Each crate states its own, and
# `spoolframe-server/tests/it/license_boundary.rs` keeps the two sides apart.
[workspace.package]
version = "0.10.0"
edition = "2024"
authors = ["Andrey Cherkashin <andoriyu@gmail.com>"]
repository = "https://git.coldsteel.casa/Spoolframe/spoolframe-server"

[workspace.dependencies]
# The server's global allocator, the one mainframe's daemons use. Built
# with the `cc` crate rather than its default cmake: neither the devshell
# nor the nix build carries cmake, and `cc` needs only the C++ compiler
# both have. `check`: snmalloc's hardening checks, a few percent of speed
# for a daemon that parses what clients and Plex send it.
snmalloc-rs = { version = "0.7.5", default-features = false, features = ["build_cc", "check"] }
# A test's own directory under a random name, removed with it, so tests
# running at once never share one.
tmpdir = "1"
# Locks that do not poison (PX-10): a panic while one is held, say from a
# parser bug a fuzzer found, must not make every later lock panic too.
# Already in the build through iroh and tokio.
parking_lot = "0.12.5"
# A body shared by every upload of the uplink measurement, sliced.
# Already in the build through reqwest and iroh.
bytes = "1.12"
# The artwork and previews caches (a memory tier in front of a disk tier)
# and the Plex replies' memory cache. Apache-2.0.
foyer = "0.22.5"
# Internal crates. The ones the SDK publishes (`publish = ["coldsteel"]`:
# types, protocol, policy, client-sdk, test-dir, hls-bridge) carry the
# workspace version as well, which `cargo publish` needs to turn the path
# into a registry dependency; bump it with `workspace.package.version`.
spoolframe-types = { path = "crates/spoolframe-types", version = "0.10.0", registry = "coldsteel" }
spoolframe-policy = { path = "crates/spoolframe-policy", version = "0.10.0", registry = "coldsteel" }
spoolframe-catalog = { path = "crates/spoolframe-catalog" }
spoolframe-plex = { path = "crates/spoolframe-plex" }
spoolframe-media = { path = "crates/spoolframe-media" }
spoolframe-protocol = { path = "crates/spoolframe-protocol", version = "0.10.0", registry = "coldsteel" }
spoolframe-admin-api = { path = "crates/spoolframe-admin-api" }
spoolframe-client-sdk = { path = "crates/spoolframe-client-sdk", version = "0.10.0", registry = "coldsteel" }
spoolframe-probe = { path = "crates/spoolframe-probe" }
spoolframe-test-dir = { path = "crates/spoolframe-test-dir", version = "0.10.0", registry = "coldsteel" }
spoolframe-hls-bridge = { path = "crates/spoolframe-hls-bridge", version = "0.10.0", registry = "coldsteel" }

# Vendored (vendor/easy-ffprobe/VENDORED.md). Only the typed model of
# ffprobe's JSON is used.
easy-ffprobe = { path = "vendor/easy-ffprobe", default-features = false, features = ["format", "streams"] }

# Async. `async-trait` because the server holds the catalog as `dyn Catalog`,
# and native async trait methods are not object-safe.
async-trait = "0.1"
# Streams (mDNS discovery events).
futures-util = { version = "0.3", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "fs", "signal", "io-util"] }

# Transport and endpoint identity (ARCHITECTURE §11). No default features:
# aws-lc-rs for TLS, and no portmapper (UPnP/NAT-PMP) or metrics while
# Phase 1 is LAN only. aws-lc-rs, not ring: it is rustls's own default
# provider, and the one the other TLS users here can share (below). Its C
# library builds with cmake (devenv.nix, nix/package.nix). Iroh picks its
# provider from its own features, so it never falls back to ring while
# nothing turns on `tls-ring`.
iroh = { version = "1.3", default-features = false, features = ["tls-aws-lc-rs"] }
# The process's TLS provider, installed by the binaries that also link
# reqwest 0.12 (see `reqwest` below): aws-lc-rs, the same as iroh's.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
# LAN discovery (P1-13). Iroh keeps mDNS out of its own crate since 1.0.
iroh-mdns-address-lookup = "0.6"
# Asks the router to forward the server's port over UPnP, NAT-PMP or PCP
# and renews it (`network.wan.mapped_port.mode = "auto"`, P6-02): iroh's
# own port mapper, the crate its `portmapper` feature turns on. Taken
# directly, by the server only: that feature would make every iroh
# endpoint in a workspace build map its port, the SDK's and the tests'
# included. No metrics, as iroh's are off.
portmapper = { version = "0.19.3", default-features = false }

# The server database: SQLite through sqlx, with its migrator. Runtime
# queries only; `macros` is for `migrate!`, which embeds the migrations.
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }

# Passwords (Argon2id, PHC strings) and session-token hashes.
argon2 = "0.5"
# Only for its `getrandom` feature: OsRng for salts and session tokens.
password-hash = { version = "0.5", features = ["getrandom"] }
blake3 = "1"
# Server key fingerprints (P1-21): SHA-256, as the format specifies.
sha2 = "0.10"
# Tests probe a UDP port as iroh binds it: IPv6 only, which std cannot
# ask for. The version already in the graph through tokio and netwatch.
socket2 = "0.6"

# Portable identities (P7-01). Ed25519 for the root key: the version iroh
# already builds, so the graph carries one curve, not two. Its defaults
# zeroize a signing key when dropped.
ed25519-dalek = "3"
# A security key as an identity's root (P7-08): P-256 ECDSA, the one
# algorithm FIDO2 keys all sign with. 0.13, the version already in the
# graph through webauthn.
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
# The recovery phrase: BIP-39, its English wordlist and checksum (CC0).
# `zeroize` clears a parsed phrase when dropped.
bip39 = { version = "2", default-features = false, features = ["std", "zeroize"] }
# The root's entropy, from the OS. Already in the build through iroh.
getrandom = "0.4"
# Clears the phrase's words and the seed once used.
zeroize = "1"

# Passkeys (P3-05). `conditional-ui` is the feature the username-less
# (discoverable) sign-in sits behind. It links OpenSSL.
# `danger-allow-state-serialisation` lets an app passkey ceremony's state
# take the challenge made from the server's id and nonce (PX-10): webauthn-rs
# only makes random ones. The states still never leave the server.
webauthn-rs = { version = "0.5.5", features = ["conditional-ui", "danger-allow-state-serialisation"] }
# For the option types webauthn-rs does not re-export.
webauthn-rs-proto = "0.5.5"
# User ids (P3-20): UUIDv7, time-ordered so they still sort by creation.
# Already in the build through webauthn-rs.
uuid = { version = "1.27", default-features = false, features = ["std", "v7"] }
# Credential ids, as base64url text.
base64 = "0.22"
# SSO (P3-04): the OpenID Connect client, which checks ID tokens itself
# (issuer, audience, expiry, nonce, signature from the provider's keys).
# Its own reqwest feature, on the reqwest 0.12 the server already has.
openidconnect = { version = "4", default-features = false, features = ["reqwest"] }
# The stand-in provider's ID token times, in tests (openidconnect's own).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# The software authenticator the passkey tests sign with.
webauthn-authenticator-rs = { version = "0.5.5", default-features = false, features = ["softtoken"] }

# The admin API: JSON-RPC over WebSocket, as kiln and scribe
# serve theirs. Crates opt into server/client features.
jsonrpsee = { version = "0.25", default-features = false }
# MCP (PX-42): the protocol's server side and its Streamable HTTP
# transport, mounted on the admin listener. Pinned: 3.5.1's macros crate
# is missing from the mirror, and the macros are not used (the tools are
# listed by hand, each with its scope). Not `auth`: the server is its own
# authorization server (crate::oauth).
rmcp = { version = "=3.5.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
# Admin CLI password prompts.
rpassword = "7"
# Tower services: the admin listener mounts jsonrpsee as one.
tower = "0.5"
# The admin listener's HTTP side (P3-01): the browser's sign-in and the web
# UI's pages beside the JSON-RPC socket.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
# A debug server's pages come from `dx serve` (spoolframe-server's
# web/dev_server.rs): hyper for the browser's connection the hot-reload
# WebSocket is tunnelled over. Both already come in with axum.
hyper = { version = "1", features = ["http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# Bodies for the HLS bridge's answers (PX-49): whole, empty or streamed.
# Already in the build through axum.
http-body-util = "0.1"

# Artwork resizing (P1-05). Decoders for what PMS serves, the JPEG and PNG
# encoders the cache writes; nothing else.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

# HTTP, for the PMS API. rustls, so the build needs no OpenSSL. 0.12,
# which openidconnect 4 and opentelemetry-otlp 0.31 also take, has no
# aws-lc-rs feature: `rustls-tls` brings ring in as the fallback reqwest
# uses only when no process provider is installed. The server and the
# probe install aws-lc-rs first thing (`rustls` above), so ring is linked
# but never chosen. Its `-no-provider` features would drop ring, but then
# every client built before that install, in a test say, panics.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
wiremock = "0.6"
# Checks the HLS playlists the server writes (P2-05), in tests.
m3u8-rs = "6"

# The web UI (P3-01), built to wasm with `dx bundle`. dx, `dioxus` and
# `wasm-bindgen` are pinned together: dx refuses to bundle on a mismatch
# (devenv.nix and nix/package.nix name the same versions).
dioxus = { version = "=0.7.10", features = ["router", "web"] }
dioxus-logger = "=0.7.10"
wasm-bindgen = "=0.2.126"
web-sys = { version = "0.3", features = ["Window", "Location", "RequestCredentials"] }
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
# The server embeds the bundle (feature `embed-web`).
rust-embed = { version = "8", features = ["interpolate-folder-path"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Pausing and resuming encodes (SIGSTOP/SIGCONT, P2-03).
libc = "0.2"
# The media tools' sandbox (PX-11 finding 34): Landlock rules and a seccomp
# filter, set in the child between fork and exec.
landlock = "0.4"
seccompiler = "0.5"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Opt-in OpenTelemetry export over OTLP (P3-14), versions that go
# together: opentelemetry 0.31 with tracing-opentelemetry 0.32. No default
# features: the SDK's internal-logs would log through the very subscriber
# that exports, and its thread-based batch processors would block the
# runtime's threads at shutdown; the server queues and batches itself.
# The metrics reader runs on tokio. gRPC (tonic) and HTTP/protobuf (on the
# reqwest the server already has), both with TLS for an https endpoint.
# gRPC's TLS is aws-lc-rs (`tls-aws-lc`). Not `tls-webpki-roots`: it turns
# on `tls`, which is tonic's ring; the server's tonic takes the webpki
# roots itself (spoolframe-server's Cargo.toml).
opentelemetry = { version = "0.31", default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.31", default-features = false, features = ["trace", "metrics", "logs", "rt-tokio", "experimental_metrics_periodicreader_with_async_runtime"] }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["grpc-tonic", "http-proto", "reqwest-client", "trace", "metrics", "logs", "tls-aws-lc"] }
tracing-opentelemetry = { version = "0.32", default-features = false }
# `experimental_use_tracing_span_context`: a log record carries the trace
# and span it was logged in, read from tracing-opentelemetry's span data,
# as a span carries no log lines (the server's `telemetry::Spans`).
opentelemetry-appender-tracing = { version = "0.31", default-features = false, features = ["experimental_use_tracing_span_context"] }
# The headers sent to a gRPC collector, and the test collector's server.
tonic = { version = "0.14", default-features = false }
# The test collector decodes what arrives.
opentelemetry-proto = { version = "0.31", default-features = false, features = ["gen-tonic", "trace", "metrics", "logs"] }
prost = "0.14"

# The client wire encoding (spoolframe-protocol): self-describing, so peers
# skip fields and variants they do not know. See the P1-10 commit.
ciborium = "0.2"
# Its low-level decoder: a request's type is read from a frame without
# decoding the rest of it (finding 50).
ciborium-ll = "0.2"
# Byte strings as CBOR byte strings, not arrays of integers.
serde_bytes = "0.11"

# Serialization. The client wire codec is P1-10's choice; serde_json here
# is for tests and for reading the PMS API.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Server configuration is UCL, as in kiln and steward. From crates.io, so a
# build needs no private registry.
uclicious = "0.10.1"

# Reads the workspace graph for the license-boundary test.
cargo_metadata = "0.23"

# The server's release build. Thin LTO lets inlining cross crate lines
# without fat LTO's link time and memory. Line tables only: panic
# backtraces and Pyroscope profiles keep file and line, without the full
# debug info's size.
[profile.release]
lto = "thin"
debug = "line-tables-only"

# The web UI's wasm (`dx bundle --profile wasm-release`). binaryen's
# wasm-opt aborts on a module carrying DWARF, so nothing of it may survive:
# symbols stripped, no debug info, and one codegen unit with LTO for a
# small download. Its own profile, so the server's release build keeps its
# usual settings (scribe met the abort first, and put these on release).
[profile.wasm-release]
inherits = "release"
lto = true
codegen-units = 1
strip = "symbols"
debug = false
opt-level = "z"
