[workspace]
resolver = "2"
members = ["crates/*"]
# Third-party crates carried with local changes; see each one's VENDORED.md.
# Not members: they keep their own license and are not linted as ours.
exclude = ["vendor"]

# No workspace-wide license: the protocol, types and client SDK are
# permissive so that any client may link them, the server crates are AGPL
# (ARCHITECTURE §56). Each crate states its own, and
# `spoolframe-server/tests/it/license_boundary.rs` keeps the two sides apart.
[workspace.package]
version = "0.4.0"
edition = "2024"
authors = ["Andrey Cherkashin <andoriyu@gmail.com>"]
repository = "https://git.coldsteel.casa/Coldsteel/foundry"

[workspace.dependencies]
# The server's global allocator, the one mainframe's daemons use. Built
# with the `cc` crate rather than its default cmake: neither the devshell
# nor the nix build carries cmake, and `cc` needs only the C++ compiler
# both have. `check`: snmalloc's hardening checks, a few percent of speed
# for a daemon that parses what clients and Plex send it.
snmalloc-rs = { version = "0.7.5", default-features = false, features = ["build_cc", "check"] }
# A test's own directory under a random name, removed with it, so tests
# running at once never share one.
tmpdir = "1"
# Internal crates
spoolframe-types = { path = "crates/spoolframe-types" }
spoolframe-policy = { path = "crates/spoolframe-policy" }
spoolframe-catalog = { path = "crates/spoolframe-catalog" }
spoolframe-plex = { path = "crates/spoolframe-plex" }
spoolframe-media = { path = "crates/spoolframe-media" }
spoolframe-protocol = { path = "crates/spoolframe-protocol" }
spoolframe-admin-api = { path = "crates/spoolframe-admin-api" }
spoolframe-client-sdk = { path = "crates/spoolframe-client-sdk" }
spoolframe-test-dir = { path = "crates/spoolframe-test-dir" }

# Vendored (vendor/easy-ffprobe/VENDORED.md). Only the typed model of
# ffprobe's JSON is used.
easy-ffprobe = { path = "vendor/easy-ffprobe", default-features = false, features = ["format", "streams"] }

# Async. `async-trait` because the server holds the catalog as `dyn Catalog`,
# and native async trait methods are not object-safe.
async-trait = "0.1"
# Streams (mDNS discovery events).
futures-util = { version = "0.3", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "fs", "signal", "io-util"] }

# Transport and endpoint identity (ARCHITECTURE §11). No default features:
# ring for TLS, and no portmapper (UPnP/NAT-PMP) or metrics while Phase 1
# is LAN only.
iroh = { version = "1.3", default-features = false, features = ["tls-ring"] }
# LAN discovery (P1-13). Iroh keeps mDNS out of its own crate since 1.0.
iroh-mdns-address-lookup = "0.6"

# The server database: SQLite through sqlx, with its migrator. Runtime
# queries only; `macros` is for `migrate!`, which embeds the migrations.
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }

# Passwords (Argon2id, PHC strings) and session-token hashes.
argon2 = "0.5"
# Only for its `getrandom` feature: OsRng for salts and session tokens.
password-hash = { version = "0.5", features = ["getrandom"] }
blake3 = "1"
# Server key fingerprints (P1-21): SHA-256, as the format specifies.
sha2 = "0.10"

# Passkeys (P3-05). `conditional-ui` is the feature the username-less
# (discoverable) sign-in sits behind. It links OpenSSL.
webauthn-rs = { version = "0.5.5", features = ["conditional-ui"] }
# For the option types webauthn-rs does not re-export.
webauthn-rs-proto = "0.5.5"
# User ids (P3-20): UUIDv7, time-ordered so they still sort by creation.
# Already in the build through webauthn-rs.
uuid = { version = "1.27", default-features = false, features = ["std", "v7"] }
# Credential ids, as base64url text.
base64 = "0.22"
# SSO (P3-04): the OpenID Connect client, which checks ID tokens itself
# (issuer, audience, expiry, nonce, signature from the provider's keys).
# Its own reqwest feature, on the reqwest 0.12 the server already has.
openidconnect = { version = "4", default-features = false, features = ["reqwest"] }
# The stand-in provider's ID token times, in tests (openidconnect's own).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# The software authenticator the passkey tests sign with.
webauthn-authenticator-rs = { version = "0.5.5", default-features = false, features = ["softtoken"] }

# The admin API: JSON-RPC over WebSocket, as the other foundry services
# serve theirs. Crates opt into server/client features.
jsonrpsee = { version = "0.25", default-features = false }
# Admin CLI password prompts.
rpassword = "7"
# Tower services: the admin listener mounts jsonrpsee as one.
tower = "0.5"
# The admin listener's HTTP side (P3-01): the browser's sign-in and the web
# UI's pages beside the JSON-RPC socket.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
# A debug server's pages come from `dx serve` (spoolframe-server's
# web/dev_server.rs): hyper for the browser's connection the hot-reload
# WebSocket is tunnelled over. Both already come in with axum.
hyper = { version = "1", features = ["http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }

# Artwork resizing (P1-05). Decoders for what PMS serves, the JPEG and PNG
# encoders the cache writes; nothing else.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

# HTTP, for the PMS API. rustls, so the build needs no OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
wiremock = "0.6"
# Checks the HLS playlists the server writes (P2-05), in tests.
m3u8-rs = "6"

# The web UI (P3-01), built to wasm with `dx bundle`. dx, `dioxus` and
# `wasm-bindgen` are pinned together: dx refuses to bundle on a mismatch
# (devenv.nix and nix/package.nix name the same versions).
dioxus = { version = "=0.7.10", features = ["router", "web"] }
dioxus-logger = "=0.7.10"
wasm-bindgen = "=0.2.126"
web-sys = { version = "0.3", features = ["Window", "Location", "RequestCredentials"] }
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
# The server embeds the bundle (feature `embed-web`).
rust-embed = { version = "8", features = ["interpolate-folder-path"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Pausing and resuming encodes (SIGSTOP/SIGCONT, P2-03).
libc = "0.2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# The client wire encoding (spoolframe-protocol): self-describing, so peers
# skip fields and variants they do not know. See the P1-10 commit.
ciborium = "0.2"
# Byte strings as CBOR byte strings, not arrays of integers.
serde_bytes = "0.11"

# Serialization. The client wire codec is P1-10's choice; serde_json here
# is for tests and for reading the PMS API.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Server configuration is UCL, as in kiln and steward. From the coldsteel
# registry — the crates.io `uclicious` is a stale 0.1.x. Not a path dep: the
# subflake is copied to the store without its siblings, so `../uclicious`
# would not exist in the nix build.
uclicious = { version = "0.9.1", registry = "coldsteel" }

# Reads the workspace graph for the license-boundary test.
cargo_metadata = "0.23"

# The web UI's wasm (`dx bundle --profile wasm-release`). binaryen's
# wasm-opt aborts on a module carrying DWARF, so nothing of it may survive:
# symbols stripped, no debug info, and one codegen unit with LTO for a
# small download. Its own profile, so the server's release build keeps its
# usual settings (scribe met the abort first, and put these on release).
[profile.wasm-release]
inherits = "release"
lto = true
codegen-units = 1
strip = "symbols"
debug = false
opt-level = "z"
